[project]
name = "mini-deepagents"
version = "0.1.0"
description = "A minimal agent harness for models with an 8K-token context window."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
